<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Paardenspel – Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Firebase compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #1e1e1e;
  color: white;
}

.screen { display:none; padding:20px; }
.active { display:block; }

input, button {
  padding:10px;
  margin:5px 0;
  font-size:16px;
}

button { cursor:pointer; }

#boardWrapper {
  position: relative;
  width: 420px;
  height: 420px;
  margin-top: 10px;
}

#boardBg {
  position: absolute;
  inset: 0;
  background-image: url("Venetia Square.png");
  background-size: cover;
  background-position: center;
  opacity: 0.45;
  z-index: 0;
  border-radius: 6px;
}

#board {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(10, 40px);
  grid-template-rows: repeat(10, 40px);
  gap: 2px;
  width: 420px;
  height: 420px;
}

.cell {
  width: 40px;
  height: 40px;
  background: rgba(0,0,0,0.25);              /* 🔥 doorschijnen */
  border: 1px solid rgba(255,255,255,0.1);  /* ✨ licht randje */
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-sizing: border-box;
}

.player {
  font-weight: bold;
}

.smuggler {
  color: gold;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <h2>Login</h2>
  <input id="email" type="email" placeholder="E-mail" />
  <input id="password" type="password" placeholder="Wachtwoord" />
  <button id="loginBtn">Inloggen / Registreren</button>
</div>

<!-- LOBBY -->
<div id="lobbyScreen" class="screen">
  <h2>Lobby</h2>
  <div id="currentUserInfo"></div>
  <input id="nickname" placeholder="Nickname" />
  <button id="createLobby">Maak lobby</button>
  <hr>
  <input id="lobbyCode" placeholder="Lobby code" />
  <button id="joinLobby">Join lobby</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <h2 id="gameTitle">Paardenspel</h2>
  <div id="gameInfo"></div>

  <button id="restartBtn">Herstart</button>

  <div id="boardWrapper">
    <div id="boardBg"></div>
    <div id="board"></div>
  </div>

  <div style="margin-top:10px;">
    <p>Paardensprong invoer (mini-raster):</p>
    <input id="step1" size="1" placeholder="1-9">
    →
    <input id="step2" size="1" placeholder="1-9">
    <button id="moveBtn">Spring</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA8LmWdVyebJSYLmKOseg8UFxZege5buMg",
  authDomain: "paardensprong-game.firebaseapp.com",
  projectId: "paardensprong-game",
  storageBucket: "paardensprong-game.appspot.com",
  messagingSenderId: "815440447520",
  appId: "1:815440447520:web:72569450503b4e77b85445"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const screens = {
  login: loginScreen,
  lobby: lobbyScreen,
  game: gameScreen
};

function show(name){
  Object.values(screens).forEach(s => s.classList.remove("active"));
  screens[name].classList.add("active");
}

let currentLobbyId = sessionStorage.getItem("currentLobbyId");
let currentPlayerId = null;
let boardState = { players: [], smugglers: [] };

const playerColors = ["white","red","green","blue"];
const startPositions = [
  {x:0,y:0},{x:9,y:0},{x:0,y:9},{x:9,y:9}
];

loginBtn.onclick = () => {
  const e = email.value;
  const p = password.value;
  auth.signInWithEmailAndPassword(e,p)
    .catch(()=>auth.createUserWithEmailAndPassword(e,p));
};

auth.onAuthStateChanged(user=>{
  if(!user){ show("login"); return; }
  currentPlayerId = user.uid;
  currentUserInfo.innerText = "Ingelogd als: " + user.email;
  currentLobbyId ? listenLobby(currentLobbyId) : show("lobby");
});

createLobby.onclick = async()=>{
  const nick = nickname.value.trim();
  if(!nick) return alert("Nickname nodig");
  const ref = db.collection("lobbies").doc();
  currentLobbyId = ref.id;
  sessionStorage.setItem("currentLobbyId",currentLobbyId);
  await ref.set({created: Date.now()});
  const index = 0;
  await ref.collection("players").doc(currentPlayerId).set({
    id: currentPlayerId,
    nickname: nick,
    x: startPositions[index].x,
    y: startPositions[index].y,
    color: playerColors[index],
    score: 0
  });
  await spawnSmugglers(ref);
  listenLobby(currentLobbyId);
};

joinLobby.onclick = async()=>{
  const code = lobbyCode.value.trim();
  const nick = nickname.value.trim();
  if(!code || !nick) return;
  currentLobbyId = code;
  sessionStorage.setItem("currentLobbyId",code);
  const ref = db.collection("lobbies").doc(code);
  const snap = await ref.collection("players").get();
  const index = snap.size;
  await ref.collection("players").doc(currentPlayerId).set({
    id: currentPlayerId,
    nickname: nick,
    x: startPositions[index].x,
    y: startPositions[index].y,
    color: playerColors[index],
    score: 0
  });
  listenLobby(code);
};

function listenLobby(id){
  show("game");
  db.collection("lobbies").doc(id).collection("players")
    .onSnapshot(s=>{
      boardState.players = s.docs.map(d=>d.data());
      draw();
      updateInfo();
    });
  db.collection("lobbies").doc(id).collection("smugglers")
    .onSnapshot(s=>{
      boardState.smugglers = s.docs.map(d=>d.data());
      draw();
    });
}

function draw(){
  board.innerHTML="";
  for(let y=0;y<10;y++){
    for(let x=0;x<10;x++){
      const c = document.createElement("div");
      c.className="cell";
      const p = boardState.players.find(p=>p.x===x && p.y===y);
      const s = boardState.smugglers.find(s=>s.x===x && s.y===y);
      if(p){
        const e = document.createElement("span");
        e.textContent="♞";
        e.style.color=p.color;
        c.appendChild(e);
      } else if(s){
        c.textContent="♟";
        c.classList.add("smuggler");
      }
      board.appendChild(c);
    }
  }
}

function updateInfo(){
  gameInfo.innerHTML =
    "<b>Lobby:</b> " + currentLobbyId + "<br>" +
    "<b>Spelers:</b> " + boardState.players.map(p=>p.nickname).join(", ");
}

async function spawnSmugglers(ref){
  for(let i=0;i<3;i++){
    await ref.collection("smugglers").add({
      x: Math.floor(Math.random()*10),
      y: Math.floor(Math.random()*10)
    });
  }
}
</script>
</body>
</html>
