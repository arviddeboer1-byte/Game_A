<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Paardensprong – Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=0.9">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  background:#1e1e1e;
  color:white;
  font-family:sans-serif;
}
.screen{display:none;padding:20px}
.active{display:block}
button,input{padding:8px;margin:4px}

/* ===== BORD ===== */
#boardWrapper{
  display:inline-block;
  position:relative;
}

#board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(10,40px);
  gap:2px;
  margin-top:10px;
  background:#1e1e1e; /* rasterlijnen */
}

/* ACHTERGROND ONDER DE CELLEN */
#boardBg{
  position:absolute;
  inset:2px;              /* <<< KRITISCH: raakt de gaps niet */
  z-index:0;
  background-image:url("Venetia Square.png");
  background-size:cover;
  background-position:center;
}

/* CELLEN */
.cell{
  position:relative;
  z-index:1;
  width:38px;
  height:38px;
  background:rgba(68,68,68,0.65);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SPELERS */
.player{font-size:20px}
.me{text-shadow:0 0 8px #0f0}
.name{position:absolute;top:-6px;font-size:9px}
.score{position:absolute;bottom:-4px;font-size:8px}
.smuggler{color:gold;font-size:20px}

/* MINI */
#mini{
  display:grid;
  grid-template-columns:repeat(3,50px);
  gap:5px;
  margin-top:10px;
}
.mini{
  width:50px;height:50px;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.mini.active{background:#0a0}
.mini.possible{background:#2a6cff}

/* BONUS */
#bonusContainer{
  margin-top:10px;
  display:flex;
  align-items:center;
  gap:5px;
}
.bonusRoller{
  width:44px;
  height:60px;
  font-size:26px;
  text-align:center;
  border-radius:8px;
  background:linear-gradient(#222,#444);
  color:#0f0;
  border:2px solid #666;
}
#unlockBtn{
  background:#2a6cff;
  color:white;
  border:none;
  border-radius:6px;
  padding:10px 14px;
}
#vaultCounter{
  margin-left:10px;
  font-size:18px;
  font-weight:bold;
  color:gold;
  min-width:60px;
}
#bonusMessage{margin-top:6px;font-weight:bold;min-height:24px}

/* KNOPPEN ONDERIN */
#gameButtons{
  position:fixed;
  bottom:10px;
  left:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  z-index:100;
}
#game{padding-bottom:80px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
  <h2>Login</h2>
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="wachtwoord">
  <button onclick="login()">Login / Registreer</button>
</div>

<!-- NICK -->
<div id="nickScreen" class="screen">
  <h2>Kies je nickname</h2>
  <input id="nick" placeholder="nickname">
  <button onclick="confirmNick()">Verder</button>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen">
  <h2>Lobby</h2>
  <div id="userInfo"></div>
  <button onclick="createLobby()">Maak lobby</button>
  <button onclick="logout()">Uitloggen</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div id="gameInfo"></div>

  <div id="gameButtons">
    <button onclick="restartGame()">🔄 Herstart</button>
    <button onclick="leaveLobby()">🚪 Verlaat lobby</button>
    <button onclick="shareLobby()">📲 Deel via WhatsApp</button>
  </div>

  <div id="boardWrapper">
    <div id="board">
      <div id="boardBg"></div>
    </div>
  </div>

  <h3>Mini-raster</h3>
  <div id="mini"></div>

  <h3>Bonus-pincode</h3>
  <div id="bonusContainer">
    <input type="number" class="bonusRoller" id="roll1" min="0" max="9" value="0">
    <input type="number" class="bonusRoller" id="roll2" min="0" max="9" value="0">
    <input type="number" class="bonusRoller" id="roll3" min="0" max="9" value="0">
    <button id="unlockBtn">Ontgrendel</button>
    <div id="vaultCounter">🔒 0</div>
  </div>

  <div id="bonusMessage"></div>
</div>

<!-- EINDSCHERM -->
<div id="end" class="screen">
  <h2>🏁 Spel afgelopen</h2>
  <div id="finalScores"></div>
  <h3 id="winner"></h3>
  <button onclick="restartAfterEnd()">Nieuw spel</button>
</div>

<!-- ===== SCRIPT (ONGEWIJZIGD) ===== -->
<script>
/* jouw bestaande JS – exact zoals je hem had */
</script>

</body>
</html>
