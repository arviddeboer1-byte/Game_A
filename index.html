<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Paardensprong – Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{margin:0;background:#1e1e1e;color:white;font-family:sans-serif}
.screen{display:none;padding:20px}
.active{display:block}
button,input{padding:6px;margin:4px}
#board{display:grid;grid-template-columns:repeat(10,40px);gap:2px;margin-top:10px}
.cell{width:40px;height:40px;background:#444;display:flex;align-items:center;justify-content:center;position:relative}
.player{font-size:22px}
.me{text-shadow:0 0 8px #0f0}
.name{position:absolute;top:-6px;font-size:9px}
.score{position:absolute;bottom:-6px;font-size:9px}
.smuggler{color:gold;font-size:20px}

/* MINI */
#mini{display:grid;grid-template-columns:repeat(3,50px);gap:5px;margin-top:10px}
.mini{width:50px;height:50px;background:#333;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mini.active{background:#0a0}
.mini.possible{background:#2a6cff}

/* LOCK */
#lock{display:flex;align-items:center;gap:10px;margin-top:10px}
.roller{background:#222;padding:10px;border-radius:6px;text-align:center}
.roller button{width:30px}
.roller .digit{font-size:22px;margin:6px 0}
</style>
</head>

<body>

<div id="login" class="screen active">
  <h2>Login</h2>
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="wachtwoord">
  <button onclick="login()">Login / Registreer</button>
</div>

<div id="nickScreen" class="screen">
  <h2>Kies je nickname</h2>
  <input id="nick" placeholder="nickname">
  <button onclick="confirmNick()">Verder</button>
</div>

<div id="lobby" class="screen">
  <h2>Lobby</h2>
  <div id="userInfo"></div>
  <button onclick="createLobby()">Maak lobby</button>
  <button onclick="logout()">Uitloggen</button>
</div>

<div id="game" class="screen">
  <div id="gameInfo"></div>
  <button onclick="restartGame()">🔄 Herstart</button>
  <button onclick="leaveLobby()">🚪 Verlaat lobby</button>
  <button onclick="shareLobby()">📲 Deel via WhatsApp</button>

  <div id="board"></div>

  <h3>Mini-raster</h3>
  <div id="mini"></div>

  <h3>🔐 Bonus-slot</h3>
  <div id="lock">
    <div class="roller"><button onclick="spin(0,1)">▲</button><div class="digit" id="d0">0</div><button onclick="spin(0,-1)">▼</button></div>
    <div class="roller"><button onclick="spin(1,1)">▲</button><div class="digit" id="d1">0</div><button onclick="spin(1,-1)">▼</button></div>
    <div class="roller"><button onclick="spin(2,1)">▲</button><div class="digit" id="d2">0</div><button onclick="spin(2,-1)">▼</button></div>
    <button onclick="unlock()">🔓 Ontgrendel</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyA8LmWdVyebJSYLmKOseg8UFxZege5buMg",
  authDomain:"paardensprong-game.firebaseapp.com",
  projectId:"paardensprong-game"
});
const auth=firebase.auth(), db=firebase.firestore();

const pi="14159265358979323846264338327950288419716939937510";

let uid,lobbyId,nickname="",cursor=5;
let rollers=[0,0,0];

const map={1:[0,0],2:[1,0],3:[2,0],4:[0,1],5:[1,1],6:[2,1],7:[0,2],8:[1,2],9:[2,2]};
const colors=["white","red","green","blue"];
const starts=[{x:0,y:0},{x:9,y:0},{x:0,y:9},{x:9,y:9}];

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}

function login(){auth.signInWithEmailAndPassword(email.value,password.value).catch(()=>auth.createUserWithEmailAndPassword(email.value,password.value));}
function logout(){auth.signOut();location.search="";show("login");}

auth.onAuthStateChanged(u=>{
  if(!u)return;
  uid=u.uid;
  lobbyId=new URLSearchParams(location.search).get("lobby");
  show("nickScreen");
});

function confirmNick(){nickname=nick.value.trim();if(!nickname)return; lobbyId?joinLobby():show("lobby");}

async function createLobby(){
  const ref=db.collection("lobbies").doc();
  lobbyId=ref.id;
  history.replaceState({}, "", "?lobby="+lobbyId);
  await ref.set({});
  await addPlayer(ref);
  await spawnSmugglers(ref);
  listen();
}

async function joinLobby(){const ref=db.collection("lobbies").doc(lobbyId);await addPlayer(ref);listen();}

async function addPlayer(ref){
  const snap=await ref.collection("players").get();
  const i=snap.size;
  await ref.collection("players").doc(uid).set({id:uid,nick:nickname,x:starts[i].x,y:starts[i].y,color:colors[i],score:0});
}

function leaveLobby(){db.collection("lobbies").doc(lobbyId).collection("players").doc(uid).delete();location.search="";show("lobby");}

async function restartGame(){
  const ref=db.collection("lobbies").doc(lobbyId);
  const p=await ref.collection("players").get();
  let i=0;
  p.forEach(d=>d.ref.update({...starts[i],color:colors[i],score:0})&&i++);
  const s=await ref.collection("smugglers").get();
  s.forEach(d=>d.ref.delete());
  await spawnSmugglers(ref);
}

async function spawnSmugglers(ref){
  for(let i=0;i<3;i++){
    const x=Math.floor(Math.random()*10),y=Math.floor(Math.random()*10);
    await ref.collection("smugglers").doc(`${x}_${y}`).set({x,y});
  }
}

function listen(){
  show("game");
  const ref=db.collection("lobbies").doc(lobbyId);
  ref.collection("players").onSnapshot(render);
  ref.collection("smugglers").onSnapshot(render);
}

async function render(){
  const ref=db.collection("lobbies").doc(lobbyId);
  const ps=(await ref.collection("players").get()).docs.map(d=>d.data());
  const sm=(await ref.collection("smugglers").get()).docs.map(d=>d.data());
  board.innerHTML="";
  for(let y=0;y<10;y++)for(let x=0;x<10;x++){
    const c=document.createElement("div");c.className="cell";
    const p=ps.find(p=>p.x===x&&p.y===y);
    if(p)c.innerHTML=`<div class="name">${p.nick}</div><div class="player ${p.id===uid?"me":""}" style="color:${p.color}">♞</div><div class="score">${p.score}</div>`;
    if(sm.find(s=>s.x===x&&s.y===y))c.innerHTML=`<div class="smuggler">♟</div>`;
    board.appendChild(c);
  }
}

function shareLobby(){
  const link=location.origin+location.pathname+"?lobby="+lobbyId;
  window.open("https://wa.me/?text="+encodeURIComponent("Doe mee: "+link));
}

/* MINI */
for(let i=1;i<=9;i++){
  const d=document.createElement("div");
  d.className="mini";d.innerText=i;
  d.onclick=()=>miniClick(i);
  mini.appendChild(d);
}
updateMini();

function updateMini(){
  document.querySelectorAll(".mini").forEach((m,i)=>{
    const n=i+1;
    const dx=map[n][0]-map[cursor][0];
    const dy=map[n][1]-map[cursor][1];
    m.classList.remove("active","possible");
    if(n===cursor)m.classList.add("active");
    else if(Math.abs(dx*dy)===2)m.classList.add("possible");
  });
}

async function miniClick(n){
  const dx=map[n][0]-map[cursor][0];
  const dy=map[n][1]-map[cursor][1];
  cursor=n;updateMini();
  if(Math.abs(dx*dy)!==2)return;

  const ref=db.collection("lobbies").doc(lobbyId);
  const pRef=ref.collection("players").doc(uid);
  const p=(await pRef.get()).data();
  let nx=Math.max(0,Math.min(9,p.x+dx));
  let ny=Math.max(0,Math.min(9,p.y+dy));

  const sRef=ref.collection("smugglers").doc(`${nx}_${ny}`);
  let score=p.score;
  if((await sRef.get()).exists){await sRef.delete();score++;}
  await pRef.update({x:nx,y:ny,score});
}

/* BONUS SLOT */
function spin(i,d){
  rollers[i]=(rollers[i]+d+10)%10;
  document.getElementById("d"+i).innerText=rollers[i];
}

function unlock(){
  const idx=(cursor-1)*3;
  const code=pi.slice(idx,idx+3).split("").map(Number);
  if(code.every((n,i)=>n===rollers[i])){
    db.collection("lobbies").doc(lobbyId).collection("players").doc(uid)
      .update({score:firebase.firestore.FieldValue.increment(1)});
    alert("✅ Bonus ontgrendeld!");
  } else alert("❌ Verkeerde code");
}
</script>
</body>
</html>
