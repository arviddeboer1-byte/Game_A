<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<title>Paardenspel – Multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Firebase compat SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#1e1e1e;
  color:white;
}

.screen { display:none; padding:20px; }
.active { display:block; }

input, button {
  padding:10px;
  margin:5px 0;
  font-size:16px;
}
button { cursor:pointer; }

/* 🔽 NIEUW: wrapper + achtergrond */
#boardWrapper {
  position: relative;
  width: 420px;
  height: 420px;
  margin-top: 10px;
}

#boardBg {
  position: absolute;
  inset: 0;
  background-image: url("Venetia Square.png");
  background-size: cover;
  background-position: center;
  opacity: 0.45;
  z-index: 0;
  border-radius: 6px;
}

#board {
  position: relative;
  z-index: 1;
  display:grid;
  grid-template-columns: repeat(10,40px);
  grid-template-rows: repeat(10,40px);
  gap:2px;
}

/* 🔽 subtiel doorschijnende cellen */
.cell {
  width:40px;
  height:40px;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-sizing:border-box;
}

.player { font-weight:bold; }
.smuggler { color:gold; font-weight:bold; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="screen active">
  <h2>Login</h2>
  <input id="email" type="email" placeholder="E-mail" />
  <input id="password" type="password" placeholder="Wachtwoord" />
  <button id="loginBtn">Inloggen / Registreren</button>
</div>

<!-- LOBBY -->
<div id="lobbyScreen" class="screen">
  <h2>Lobby</h2>
  <div id="currentUserInfo"></div>
  <input id="nickname" placeholder="Nickname" />
  <button id="createLobby">Maak lobby</button>
  <hr>
  <input id="lobbyCode" placeholder="Lobby code" />
  <button id="joinLobby">Join lobby</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <h2 id="gameTitle"></h2>
  <div id="gameInfo"></div>

  <button id="restartBtn">Herstart</button>

  <!-- 🔽 ENIGE STRUCTURELE WIJZIGING -->
  <div id="boardWrapper">
    <div id="boardBg"></div>
    <div id="board"></div>
  </div>

  <!-- 🔴 HIERONDER BLIJFT ALLES ZOALS JE HET HAD -->
  <!-- mini-raster -->
  <!-- pincode rollers -->
  <!-- bonus knop -->
</div>

<script>
/* 🔴 JE BESTAANDE, WERKENDE SCRIPT
   EXACT OVERNEMEN HIERONDER
   (Firebase, lobby, mini-raster, pincode, bonus, etc.)
*/
</script>

</body>
</html>
